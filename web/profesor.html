<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Profesor - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      position: relative;
    }
    header button {
      position: absolute;
      right: 20px;
      top: 10px;
    }
    .card {
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      border-radius: 10px;
    }
    .card-header {
      font-weight: bold;
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
    }
    footer {
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    Panel del Profesor - SmartCampusGuide
    <button class="btn btn-danger" onclick="cerrarSesion()">
      <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
    </button>
  </header>
  <div class="container">
    <!-- Videoclases -->
    <div class="card">
      <div class="card-header">Video Clases</div>
      <div class="card-body">
        <a href="videoclases.html" class="btn btn-primary">Ir a videoclases</a>
      </div>
    </div>

    <!-- Sensores -->
    <div class="card">
      <div class="card-header">Sensores</div>
      <div class="card-body">
        <a href="sensores.html" class="btn btn-success">Ver resultados</a>
      </div>
    </div>

    <!-- Métricas WiFi -->
    <div class="card">
    <!--  <div class="card-header">Métricas WiFi</div>  -->
      <div class="card-body">
        <a href="metricaswifi.html" class="btn btn-info">Ver métricas</a>
      </div>
    </div>

    <!-- Radio UNGE -->
    <div class="card">
      <div class="card-header">Radio UNGE</div>
      <div class="card-body">
        <a href="radiounge.html" class="btn btn-warning">Sintonizar programas</a>
      </div>
    </div>

    <!-- Transporte Escolar -->
    <div class="card">
      <div class="card-header">Transporte Escolar</div>
      <div class="card-body">
        <a href="transporteescolar.html" class="btn btn-secondary">Ver rutas y buses</a>
      </div>
    </div>

    <!-- Mapa -->
    <div class="card">
      <div class="card-header">Mapa del Campus</div>
      <div class="card-body">
        <a href="mapa.html" class="btn btn-dark">Abrir mapa</a>
      </div>
    </div>
  </div>

  <!-- Pie de página -->
  <footer>
    TODOS LOS DERECHOS RESERVADOS - UNGE © IoT A NUESTRO ALCANCE - 2026
  </footer>
  <!-- Scripts -->
  <script>
    function cerrarSesion() {
      if (confirm("¿Estás seguro de que deseas cerrar sesión?")) {
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
