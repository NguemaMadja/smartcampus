<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Profesor - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1.5rem;
      font-weight: bold;
    }
    header button {
      float: right;
    }
    .card {
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      border-radius: 10px;
    }
    .card-header {
      font-weight: bold;
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
    }
    footer {
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    Panel del Profesor - SmartCampusGuide
    <button class="btn btn-danger ms-3" onclick="cerrarSesion()">
      <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
    </button>
  </header>
  <div class="container">
    <!-- Videoclases -->
    <div class="card">
      <div class="card-header">Video Clases</div>
      <div class="card-body">
        <button class="btn btn-primary" onclick="cargarVideoclases()">Ver videoclases</button>
        <ul id="listaVideoclases" class="mt-3"></ul>
      </div>
    </div>

    <!-- Sensores -->
    <div class="card">
      <div class="card-header">Sensores</div>
      <div class="card-body">
        <button class="btn btn-success" onclick="cargarSensores()">Ver resultados</button>
        <ul id="listaSensores" class="mt-3"></ul>
      </div>
    </div>

    <!-- Métricas WiFi -->
    <div class="card">
      <div class="card-header">Métricas WiFi</div>
      <div class="card-body">
        <button class="btn btn-info" onclick="cargarMetricas()">Ver métricas</button>
        <ul id="listaMetricas" class="mt-3"></ul>
      </div>
    </div>

    <!-- Radio UNGE -->
    <div class="card">
      <div class="card-header">Radio UNGE</div>
      <div class="card-body">
        <button class="btn btn-warning" onclick="cargarRadio()">Sintonizar programas</button>
        <ul id="listaRadio" class="mt-3"></ul>
      </div>
    </div>

    <!-- Transporte Escolar -->
    <div class="card">
      <div class="card-header">Transporte Escolar</div>
      <div class="card-body">
        <button class="btn btn-secondary" onclick="cargarTransporte()">Ver rutas y buses</button>
        <ul id="listaTransporte" class="mt-3"></ul>
      </div>
    </div>

    <!-- Mapa -->
    <div class="card">
      <div class="card-header">Mapa del Campus</div>
      <div class="card-body">
        <button class="btn btn-dark" onclick="cargarMapa()">Abrir mapa</button>
        <div id="mapaContainer" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- Pie de página -->
  <footer>
    TODOS LOS DERECHOS RESERVADOS - UNGE © IoT A NUESTRO ALCANCE - 2026
  </footer>
  <!-- Scripts -->
  <script>
    function cerrarSesion() {
      if (confirm("¿Estás seguro de que deseas cerrar sesión?")) {
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    }

    async function cargarVideoclases() {
      const res = await fetch("/videoclases");
      const data = await res.json();
      const lista = document.getElementById("listaVideoclases");
      lista.innerHTML = "";
      data.forEach(v => {
        const li = document.createElement("li");
        li.textContent = `${v.titulo} - ${v.profesor}`;
        lista.appendChild(li);
      });
    }

    async function cargarSensores() {
      const res = await fetch("/sensores");
      const data = await res.json();
      const lista = document.getElementById("listaSensores");
      lista.innerHTML = "";
      data.forEach(s => {
        const li = document.createElement("li");
        li.textContent = `${s.tipo}: ${s.valor} (${s.unidad})`;
        lista.appendChild(li);
      });
    }

    async function cargarMetricas() {
      const res = await fetch("/metricaswifi");
      const data = await res.json();
      const lista = document.getElementById("listaMetricas");
      lista.innerHTML = "";
      data.forEach(m => {
        const li = document.createElement("li");
        li.textContent = `${m.ssid} - ${m.intensidad} dBm`;
        lista.appendChild(li);
      });
    }

    async function cargarRadio() {
      const res = await fetch("/radiounge");
      const data = await res.json();
      const lista = document.getElementById("listaRadio");
      lista.innerHTML = "";
      data.forEach(r => {
        const li = document.createElement("li");
        li.textContent = `${r.programa} - ${r.hora}`;
        lista.appendChild(li);
      });
    }

    async function cargarTransporte() {
      const res = await fetch("/transporteescolar");
      const data = await res.json();
      const lista = document.getElementById("listaTransporte");
      lista.innerHTML = "";
      data.forEach(t => {
        const li = document.createElement("li");
        li.textContent = `Bus ${t.bus} - Ruta ${t.ruta} - Posición ${t.posicion}`;
        lista.appendChild(li);
      });
    }

    async function cargarMapa() {
      const res = await fetch("/mapa");
      const data = await res.json();
      const cont = document.getElementById("mapaContainer");
      cont.innerHTML = `<p>Mapa cargado con ${data.lugares.length} lugares disponibles.</p>`;
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
