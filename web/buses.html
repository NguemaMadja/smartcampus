<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Buses - SmartCampusGuide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">

  <style>
    /* Botones de navegación impactantes */
    .btn-gradient {
      font-weight: bold;
      color: #fff;
      border: none;
      padding: 15px 25px;
      font-size: 1.2rem;
      border-radius: 10px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn-gradient-green {
      background: linear-gradient(45deg, #28a745, #85e085);
    }
    .btn-gradient-blue {
      background: linear-gradient(45deg, #007bff, #66b2ff);
    }
    .btn-gradient-orange {
      background: linear-gradient(45deg, #fd7e14, #ffb366);
    }
    .btn-gradient-purple {
      background: linear-gradient(45deg, #6f42c1, #b366ff);
    }
    .btn-gradient:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: rgba(0, 64, 128, 0.85);">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="admin.html">SmartCampusGuide</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="buses.html">Buses</a></li>
        <li class="nav-item"><a class="nav-link" href="rutas.html">Rutas</a></li>
        <li class="nav-item"><a class="nav-link" href="paradas.html">Paradas</a></li>
        <li class="nav-item"><a class="nav-link" href="posiciones.html">Posiciones</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Botones de navegación impactantes -->
<div class="d-flex flex-wrap gap-3 justify-content-center my-4">
  <a href="buses.html" class="btn btn-gradient btn-gradient-green shadow-lg">🚍 Buses</a>
  <a href="rutas.html" class="btn btn-gradient btn-gradient-blue shadow-lg">🛣️ Rutas</a>
  <a href="paradas.html" class="btn btn-gradient btn-gradient-orange shadow-lg">📍 Paradas</a>
  <a href="posiciones.html" class="btn btn-gradient btn-gradient-purple shadow-lg">📡 Posiciones</a>
</div>

<div class="container mt-4">
  <h2 class="mb-4">Gestión de Buses</h2>
  <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalBus">➕ Nuevo Bus</button>

  <table id="tablaBuses" class="display table table-striped table-bordered nowrap" style="width:100%">
    <thead class="table-dark">
      <tr>
        <th>ID Bus</th>
        <th>Número</th>
        <th>Placa</th>
        <th>Conductor</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<footer class="text-center mt-4 p-3" style="background-color: rgba(0, 64, 128, 0.85); color: white;">
  TODOS LOS DERECHOS RESERVADOS - UNGE © IoT A NUESTRO ALCANCE - 2026
</footer>
<div class="modal fade" id="modalBus" tabindex="-1">
  <div class="modal-dialog">
    <form id="formBus" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nuevo Bus</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="busId">
        <div class="mb-3"><label class="form-label">Número</label><input type="text" id="numero" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Placa</label><input type="text" id="placa" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Conductor</label><input type="text" id="conductor" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Capacidad</label><input type="number" id="capacidad" class="form-control" required></div>
        <div class="mb-3">
          <label class="form-label">Estado</label>
          <select id="estado" class="form-select" required>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
            <option value="mantenimiento">Mantenimiento</option>
          </select>
        </div>
      </div>
      <div class="modal-footer"><button type="submit" class="btn btn-primary">Guardar</button></div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {
  const API_BASE = "https://smarcampus.onrender.com/transporteescolar";

  const tablaBuses = $('#tablaBuses').DataTable({
    dom: '<"top"fB>rt<"bottom"lip>',
    buttons: [
      { extend: 'csv', text: '⬇️ CSV' },
      { extend: 'excel', text: '⬇️ Excel' },
      { extend: 'print', text: '🖨️ Imprimir' }
    ],
    responsive: true,
    language: {
      search: "🔍 Buscar:",
      lengthMenu: "Mostrar _MENU_ registros",
      info: "Mostrando _START_ a _END_ de _TOTAL_ buses"
    }
  });

  // Cargar buses
  function cargarBuses() {
    fetch(`${API_BASE}/buses`)
      .then(res => res.json())
      .then(data => {
        tablaBuses.clear();
        data.forEach(bus => {
          tablaBuses.row.add([
            bus.id_bus,
            bus.numero,
            bus.placa,
            bus.conductor,
            bus.capacidad,
            bus.estado,
            `<button class="btn btn-sm btn-warning editar" data-id="${bus.id_bus}">✏️ Editar</button>
             <button class="btn btn-sm btn-danger eliminar" data-id="${bus.id_bus}">🗑️ Eliminar</button>`
          ]);
        });
        tablaBuses.draw();
      })
      .catch(err => console.error("Error cargando buses:", err));
  }
  cargarBuses();

  // Guardar bus (crear o editar)
  $('#formBus').submit(function(e) {
    e.preventDefault();
    const id = $('#busId').val();
    const bus = {
      numero: $('#numero').val(),
      placa: $('#placa').val(),
      conductor: $('#conductor').val(),
      capacidad: $('#capacidad').val(),
      estado: $('#estado').val()
    };
    const metodo = id ? 'PUT' : 'POST';
    const url = id ? `${API_BASE}/buses/${id}` : `${API_BASE}/buses`;

    fetch(url, {
      method: metodo,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bus)
    })
    .then(res => res.json())
    .then(() => {
      bootstrap.Modal.getInstance(document.getElementById('modalBus')).hide();
      cargarBuses();
    })
    .catch(err => console.error("Error guardando bus:", err));
  });

  // Editar bus
  $('#tablaBuses').on('click', '.editar', function() {
    const id = $(this).data('id');
    fetch(`${API_BASE}/buses/${id}`)
      .then(res => res.json())
      .then(bus => {
        $('#busId').val(bus.id_bus);
        $('#numero').val(bus.numero);
        $('#placa').val(bus.placa);
        $('#conductor').val(bus.conductor);
        $('#capacidad').val(bus.capacidad);
        $('#estado').val(bus.estado);
        $('.modal-title').text("Editar Bus");
        $('#modalBus').modal('show');
      })
      .catch(err => console.error("Error cargando bus:", err));
  });

  // Eliminar bus
  $('#tablaBuses').on('click', '.eliminar', function() {
    const id = $(this).data('id');
    if(confirm("¿Seguro que deseas eliminar este bus?")) {
      fetch(`${API_BASE}/buses/${id}`, { method: 'DELETE' })
        .then(() => cargarBuses())
        .catch(err => console.error("Error eliminando bus:", err));
    }
  });
});
</script>
</body>
</html>
